# docker-compose.prod.yml — Hostinger VPS deploy, behind the pre-installed
# Traefik (host network, auto-discovers containers via the Docker socket —
# see ARQUITETURA.md §7.x). Local dev keeps using docker-compose.yml
# (Postgres/Redis only); this file is the full production stack.
#
# Usage on the VPS:
#   cp .env.prod.example .env.prod   # fill in real secrets, never commit
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: harmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: harmon
    volumes:
      - harmon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - harmon_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: applies pending Prisma migrations, then exits. api waits for
  # this to finish successfully before starting (ARQUITETURA.md §7.x:
  # "aplicada por serviço migrator no deploy").
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: npm run migrate:deploy --workspace=@harmon/db
    environment:
      DATABASE_URL: postgresql://harmon:${POSTGRES_PASSWORD}@postgres:5432/harmon?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://harmon:${POSTGRES_PASSWORD}@postgres:5432/harmon?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
      PORT: "3001"
      APP_BASE_URL: https://${DOMAIN}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.harmon-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/v1`)"
      - "traefik.http.routers.harmon-api.entrypoints=websecure"
      - "traefik.http.routers.harmon-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.harmon-api.priority=10"
      - "traefik.http.services.harmon-api.loadbalancer.server.port=3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.harmon-web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.harmon-web.entrypoints=websecure"
      - "traefik.http.routers.harmon-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.harmon-web.priority=1"
      - "traefik.http.services.harmon-web.loadbalancer.server.port=8080"

volumes:
  harmon_postgres_data:
  harmon_redis_data:
